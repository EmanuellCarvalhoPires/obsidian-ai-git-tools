name: Release

# Publishes a release with main.js, manifest.json and styles.css, either by
# pushing a tag such as 1.0.0 or by running this workflow by hand (Actions >
# Release > Run workflow), which creates the tag itself on the chosen branch.
# Either way the version must match manifest.json.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (leave empty to use manifest.json)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve the version and check it matches manifest.json
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION:-$manifest}"
            if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "Version $tag was already released. Bump manifest.json first." >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ "$tag" != "$manifest" ]; then
            echo "Version $tag does not match manifest.json version $manifest." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --target "$GITHUB_SHA" --generate-notes
